    <script>
      // Automatically purge stale/rogue Service Workers & caches from previous localhost apps
      if (typeof window !== 'undefined' && 'serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          var shouldClean = registrations.length > 0 || !!navigator.serviceWorker.controller;
          for (var reg of registrations) {
            reg.unregister();
          }
          if ('caches' in window) {
            caches.keys().then(function(keys) {
              if (keys.length > 0 || shouldClean) {
                Promise.all(keys.map(function(k) { return caches.delete(k); })).then(function() {
                  if (shouldClean && !sessionStorage.getItem('__sw_purged')) {
                    sessionStorage.setItem('__sw_purged', '1');
                    window.location.reload();
                  }
                });
              }
            });
          }
        });
      }
    </script>
